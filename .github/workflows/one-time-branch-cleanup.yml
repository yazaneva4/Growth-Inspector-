name: One-time branch cleanup

on:
  push:
    branches:
      - claude/growth-inspector-saudi-int7vg

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-default branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            'claude/growth-inspector-auth-fix' \
            'fix/growth-inspector-auth-email-password'; do
            if gh api "/repos/${{ github.repository }}/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "/repos/${{ github.repository }}/git/refs/heads/$branch"
              echo "Deleted $branch"
            else
              echo "$branch already absent"
            fi
          done
      - name: Remove this cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-branch-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-branch-cleanup.yml
          git commit -m 'Remove one-time branch cleanup workflow'
          git push origin HEAD:claude/growth-inspector-saudi-int7vg
