name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src --max-warnings=-1
      - run: npm run build
        env:
          # Public Supabase values — safe to expose (RLS-protected).
          NEXT_PUBLIC_SUPABASE_URL: https://ttjzmmqalbfeybysmqko.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_LztXbrEa4Evw12Iehs4H5A_ivQU-ZOz
