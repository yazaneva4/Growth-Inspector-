name: Repair login page
on:
  push:
    branches: [claude/growth-inspector-saudi-int7vg]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write repaired login page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/login/page.tsx')
          s = p.read_text()
          s = s.replace('import { useRouter } from "next/navigation";', 'import { useSearchParams, useRouter } from "next/navigation";')
          s = s.replace('  const router = useRouter();\n', '  const router = useRouter();\n  const searchParams = useSearchParams();\n')
          s = s.replace('  const [email, setEmail] = useState(rememberedEmail);\n', '  const [email, setEmail] = useState(rememberedEmail);\n  const [password, setPassword] = useState("");\n')
          s = s.replace('  useEffect(() => { if (codeSent)', '  useEffect(() => { const invitedEmail = searchParams.get("email"); if (invitedEmail && !email) setEmail(invitedEmail.toLowerCase()); }, [searchParams, email]);\n  useEffect(() => { if (codeSent)')
          old = '''  async function requestCode() {\n    const normalizedEmail = email.trim().toLowerCase(); if (!normalizedEmail) throw new Error("Enter your email address first.");\n    const supabase = createClient();\n    const { error: authError } = await supabase.auth.signInWithOtp({ email: normalizedEmail, options: { shouldCreateUser: mode === "signup", emailRedirectTo: `${appOrigin()}/auth/callback?next=/dashboard/inbox` } });\n    if (authError) throw authError;\n    setCodeSent(true); setNotice(`Growth Inspector sent a 6-digit sign-in code to ${normalizedEmail}.`);\n  }'''
          new = '''  async function requestCode() {\n    const normalizedEmail = email.trim().toLowerCase(); if (!normalizedEmail) throw new Error("Enter your email address first.");\n    if (password.length < 8) throw new Error("Password must be at least 8 characters.");\n    const supabase = createClient();\n    if (mode === "signup") {\n      const { error: authError } = await supabase.auth.signUp({ email: normalizedEmail, password, options: { emailRedirectTo: `${appOrigin()}/auth/callback?next=/dashboard/inbox` } });\n      if (authError) throw authError;\n    } else {\n      const check = await fetch("/api/auth/check-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: normalizedEmail, password }) });\n      const result = await check.json().catch(() => ({}));\n      if (!check.ok) throw new Error(result.error || "The email or password is incorrect.");\n      const { error: authError } = await supabase.auth.signInWithOtp({ email: normalizedEmail, options: { shouldCreateUser: false, emailRedirectTo: `${appOrigin()}/auth/callback?next=/dashboard/inbox` } });\n      if (authError) throw authError;\n    }\n    setCodeSent(true); setNotice(`Growth Inspector sent a 6-digit verification code to ${normalizedEmail}.`);\n  }'''
          if old not in s: raise SystemExit('requestCode pattern not found')
          s = s.replace(old, new)
          s = s.replace('    <form onSubmit={submit} className="space-y-4"><input type="email"', '    <form onSubmit={submit} className="space-y-4"><input type="email"')
          needle = '      {codeSent && <input id="growth-ai-code"'
          s = s.replace(needle, '      <input type="password" required minLength={8} autoComplete={mode === "signin" ? "current-password" : "new-password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password" className="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" />\n      {codeSent && <input id="growth-ai-code"')
          p.write_text(s)
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/repair-login.yml
          git add src/app/login/page.tsx .github/workflows/repair-login.yml
          git commit -m "Restore password to Growth Inspector authentication"
          git push
